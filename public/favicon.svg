<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- 3D Electric Blue Gradient for outer crescent -->
    <linearGradient id="suitechBlue3D" x1="250" y1="50" x2="450" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006EFE" />
      <stop offset="100%" stop-color="#0052C6" />
    </linearGradient>
    
    <!-- Deep Navy Gradient for Dark Half -->
    <linearGradient id="suitechNavy" x1="100" y1="50" x2="250" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E203C" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="suitechGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#006EFE" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer 3D Electric Blue Bevel Crescent -->
  <path d="M 250 25 A 225 225 0 0 1 475 250 A 225 225 0 0 1 250 475 C 330 460 410 380 410 250 C 410 120 330 40 250 25 Z" fill="url(#suitechBlue3D)" filter="url(#suitechGlow)" />

  <!-- Main Yin Yang Sphere Base (Radius 210) -->
  <g transform="translate(0, 0)">
    <!-- White / Right side -->
    <circle cx="250" cy="250" r="215" fill="#FFFFFF" />

    <!-- Dark Navy Half (Yin Yang Curve) -->
    <!-- Starts at top (250, 35), curves down around upper center (250, 142.5), then curves around lower center (250, 357.5) to bottom (250, 465), and arc back along left perimeter -->
    <path d="
      M 250 35 
      A 107.5 107.5 0 0 1 250 250 
      A 107.5 107.5 0 0 0 250 465 
      A 215 215 0 0 1 250 35 
      Z" 
      fill="url(#suitechNavy)" 
    />

    <!-- Right Blue Outer Rim 3D Layer -->
    <path d="
      M 250 35
      A 215 215 0 0 1 250 465
      C 320 440 395 370 395 250
      C 395 130 320 60 250 35
      Z"
      fill="url(#suitechBlue3D)"
    />

    <!-- White Dot inside Top Dark Area -->
    <circle cx="250" cy="142.5" r="30" fill="#FFFFFF" />

    <!-- Electric Blue Dot inside Bottom Light Area -->
    <circle cx="250" cy="357.5" r="30" fill="#006EFE" />
  </g>
</svg>
